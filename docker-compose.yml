services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: task_tracker
      MYSQL_USER: task_user
      MYSQL_PASSWORD: task_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/task_tracker?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: task_user
      DB_PASSWORD: task_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: replace-this-with-a-long-production-secret-please
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
